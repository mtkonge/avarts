<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Avarts</title>
    <link href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
</head>

<body class="map-page">
    <div id="map"></div>
    <div id="toolbar">
        <button id="create-route">Create route</button>
        <button id="finish-route" hidden>Finish route</button>
    </div>

    <div id="leaderboard-popup" hidden="true">
        <div id="leaderboard-wrapper">
            <div id="close-btn-wrapper">
                <button id="close-leaderboard-btn" class="maplibregl-popup-close-button">
                    x
                </button>
            </div>
            <div id="leaderboard-title">
                Loading...
            </div>
            <div id="leaderboard-content">
                Loading...
            </div>
        </div>
    </div>
    <script>
        document.getElementById("close-btn-wrapper").addEventListener("click", () => {
            document.getElementById("leaderboard-popup").hidden = true
        })
    </script>
    <script src="main.js" type="module"></script>
</body>

</html>
