<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Avarts</title>
        <link
            href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/style.css">
    </head>

    <body class="map-page">
        <div id="map"></div>
        <div id="toolbar">
            <button id="create-route">Create route</button>
            <button id="finish-route" hidden>Finish route</button>
            <button id="select-sport">🛼</button>
            <span class="toolbar-seperator"></span>
            <a href="/profile"><button id="profile">My profile</button></a>
            <button id="log-out">Log out</button>
        </div>

        <dialog id="leaderboard-dialog" popover>
            <div id="dialog-flex-wrapper">
                <div class="close-button-wrapper">
                    <button
                        id="close-leaderboard-btn"
                        class="close-button"
                        popovertarget="leaderboard-dialog"
                        popovertargetaction="hide"
                    >
                        ×
                    </button>
                </div>
                <div id="leaderboard-title">
                    Loading...
                </div>
                <ol id="leaderboard-content">
                    Loading...
                </ol>
            </div>
        </dialog>

        <dialog id="sport-dialog" popover>
            <div id="dialog-flex-wrapper">
                <div class="close-button-wrapper">
                    <button
                        id="close-leaderboard-btn"
                        class="close-button"
                        popovertarget="sport-dialog"
                        popovertargetaction="hide"
                    >
                        ×
                    </button>
                </div>
                <ul id="sport-content">
                    Loading...
                </ul>
            </div>
        </dialog>
        <script src="main.js" type="module"></script>
    </body>
</html>
