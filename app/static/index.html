<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Avarts</title>
        <link
            href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css"
            rel="stylesheet"
        />
        <link rel="manifest" href="/manifest.json" />
        <link rel="stylesheet" href="/style.css">
    </head>

    <body class="map-page">
        <div id="map"></div>
        <div id="toolbar">
            <button id="create-route">Create route</button>
            <button id="finish-route" hidden>Finish route</button>
            <button id="select-sport">🛼</button>
            <span class="flex-divider"></span>
            <a href="/profile"><button id="profile">My profile</button></a>
            <button id="log-out">Log out</button>
        </div>

        <dialog id="leaderboard-dialog">
            <div class="dialog-wrapper">
                <div class="close-button-wrapper">
                    <button
                        id="leaderboard-close-button"
                        class="close-button"
                    >
                        ×
                    </button>
                </div>
                <h1 id="leaderboard-title"></h1>
                <hr>
                <ul id="leaderboard-content"></ul>
            </div>
        </dialog>
        <button id="follow-user">Follow</button>

        <script src="main.js" type="module"></script>
    </body>
</html>
